  readme:
    title: KALLAX filament holders
    summary: 3D-printable holders for storing 3D printer filament in an IKEA KALLAX
      shelving unit. One cell holds five reels at the front and five strapped filament
      refills without spools on a raised rear row. This repository includes printable
      files, editable source and illustrated assembly instructions.
    ai_notice: This is an entirely AI-generated coding project. The source code is
      largely unreadable by humans, but usable generated files are included. It is
      published so others can use their own AI tools to understand, modify and regenerate
      the design.
    credit: null
    viewer_url: null
    version_title: One cell
    version_description: Four short and four tall frames; four adjustable M6 rails.
      Five front reels and five rear refills.
    installation: Place the tall holder at the rear and the short holder at the front.
      Seat all feet on the shelf. Load the strapped rear refills, then the five front
      reels.
