    details_title: Project details
    details:
    - 'One cell: independent short front holder and tall rear holder. Four frames
      and two rails per holder.'
    - 'Nominal opening: 335 mm. Rail heights: 37 mm front, 112 mm rear. Row centres:
      187 mm.'
    - Print all plastic parts in black. Use the 11 mm nut covers and 11 mm slotted
      covers.
    - Cut four M6 threaded rods to 300 mm and deburr the ends. Prepare a 10 mm spanner.
    - 'Each rail: one 18 mm M6 coupling nut, one M6 x 25 fully threaded hex bolt and
      five M6 nuts.'
    - Seat the fixed nut and bolt head in the outer frame recesses. Retain the bolt
      with an inner nut.
    - 'Nominal coupling engagement: rod 5.99 mm; bolt 7 mm. Bolt length is measured
      under the head.'
    - Measure the actual opening before adjustment. Do not force the cabinet sides
      apart.
    - Keep refills strapped. Illustrated front reels are 200 mm diameter x 60 mm wide.
    - 'M6 x 300 threaded rod: OOMP record pending. No shortlink is assigned.'
    - AI-generated CAD images and instructions. Errors possible. Physical fit and
      load capacity untested.
    summary_title: Printed parts
    hardware_title: Hardware
    summary_step: true
    summary_view: book_cover
    signature_pages: 4
